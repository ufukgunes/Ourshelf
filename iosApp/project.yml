# XcodeGen tanımı. Xcode projesi (Ourshelf.xcodeproj) bu dosyadan CI'da üretilir; repoya girmez.
#   brew install xcodegen && cd iosApp && xcodegen generate
name: Ourshelf
options:
  bundleIdPrefix: com.ourshelf
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ourshelf:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Ourshelf
        UILaunchScreen: {}
        # ProMotion (120Hz) ekranlarda tam kare hızı.
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Kitapları eklemek için arka kapaktaki ISBN barkodunu okutursun. / Scan a book's ISBN barcode to add it."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ourshelf.app
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: ["-framework", "ComposeApp"]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Compile Kotlin Framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
